<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TauriTavern Console</title>
  <script type="module" crossorigin src="/assets/index-BNldJzqs.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CaIpA_yN.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="logo">TauriTavern <span>Console</span></h1>
      <div class="header-actions">
        <button id="btn-import" class="btn btn-primary">Import Cartridge</button>
        <button id="btn-settings" class="btn btn-ghost" title="Settings">&#9881;</button>
      </div>
    </header>

    <main class="main">
      <div id="cartridge-grid" class="cartridge-grid">
        <div class="empty-state">
          <p>No cartridges installed.</p>
          <p class="sub">Click "Import Cartridge" to add a <code>.taurichar</code> file.</p>
        </div>
      </div>
    </main>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="btn-close-settings" class="btn btn-ghost">&times;</button>
        </div>
        <div class="modal-body">
          <div class="provider-section">
            <h3>Anthropic</h3>
            <label>
              <span>API Key</span>
              <input type="password" id="api-key-anthropic" placeholder="sk-ant-..." data-placeholder="sk-ant-..." />
            </label>
            <button class="btn btn-sm btn-primary" data-provider="anthropic">Save</button>
          </div>
          <div class="provider-section">
            <h3>OpenAI / Compatible</h3>
            <label>
              <span>API Key</span>
              <input type="password" id="api-key-openai" placeholder="sk-..." data-placeholder="sk-..." />
            </label>
            <button class="btn btn-sm btn-primary" data-provider="openai">Save</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

</body>
</html>
