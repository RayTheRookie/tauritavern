<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TauriTavern Console</title>
  <script type="module" crossorigin src="/assets/index-j_7A1_6U.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-tkU41fw-.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="logo">TauriTavern <span>Console</span></h1>
      <div class="header-actions">
        <button id="btn-import" class="btn btn-primary">Import Cartridge</button>
        <button id="btn-settings" class="btn btn-ghost" title="Settings">&#9881;</button>
      </div>
    </header>

    <main class="main">
      <div id="cartridge-grid" class="cartridge-grid">
        <div class="empty-state">
          <p>No cartridges installed.</p>
          <p class="sub">Click "Import Cartridge" to add a <code>.taurichar</code> file.</p>
        </div>
      </div>
    </main>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="btn-close-settings" class="btn btn-ghost">&times;</button>
        </div>
        <div class="modal-body">
          <div class="provider-selector">
            <label>
              <span>Provider</span>
              <select id="provider-dropdown">
                <option value="">-- Select Provider --</option>
              </select>
            </label>
          </div>
          <div id="provider-config" class="provider-config hidden">
            <label>
              <span>API Key</span>
              <input type="password" id="api-key-input" placeholder="" />
            </label>
            <label id="provider-url-group" class="hidden">
              <span>API URL</span>
              <input type="text" id="provider-url-input" placeholder="https://api.example.com/v1/chat/completions" />
            </label>
            <div class="provider-actions">
              <button id="btn-save-provider" class="btn btn-sm btn-primary">Save</button>
              <button id="btn-delete-provider" class="btn btn-sm btn-ghost">Delete Key</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

</body>
</html>
