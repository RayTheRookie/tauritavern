<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f14"/>
      <stop offset="100%" style="stop-color:#4a3020"/>
    </linearGradient>
    <linearGradient id="sword" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#f0d0a0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="#6b4c30" stroke-width="3"/>

  <!-- Wine gourd (left side) -->
  <ellipse cx="75" cy="115" rx="22" ry="28" fill="#8B4513" stroke="#5a2d0c" stroke-width="2"/>
  <rect x="71" y="84" width="8" height="10" rx="3" fill="#6b3410"/>
  <circle cx="75" cy="82" r="4" fill="#8B4513"/>
  <text x="75" y="122" font-size="14" fill="#f0d080" text-anchor="middle">&#37202;</text>

  <!-- Sword (right side, diagonal) -->
  <line x1="100" y1="55" x2="140" y2="145" stroke="url(#sword)" stroke-width="5" stroke-linecap="round"/>
  <!-- Sword guard -->
  <line x1="90" y1="68" x2="110" y2="60" stroke="#d4a574" stroke-width="4" stroke-linecap="round"/>
  <!-- Sword handle -->
  <line x1="100" y1="55" x2="95" y2="50" stroke="#5a3a1a" stroke-width="6" stroke-linecap="round"/>

  <!-- Flowing hair / robe hint -->
  <path d="M60 50 Q50 80 55 120" fill="none" stroke="#ccc" stroke-width="2" opacity="0.4"/>
  <path d="M140 50 Q150 80 145 120" fill="none" stroke="#ccc" stroke-width="2" opacity="0.4"/>

  <!-- Face (abstract/minimal) -->
  <circle cx="100" cy="65" r="20" fill="#e8c090" stroke="#c0a070" stroke-width="1.5"/>
  <!-- Eyes -->
  <line x1="92" y1="63" x2="96" y2="63" stroke="#2a1a0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="63" x2="108" y2="63" stroke="#2a1a0a" stroke-width="2" stroke-linecap="round"/>
  <!-- Mouth (smirk) -->
  <path d="M94 74 Q100 78 106 73" fill="none" stroke="#2a1a0a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Rosy cheeks (drunken) -->
  <circle cx="86" cy="70" r="5" fill="#e8a0a0" opacity="0.5"/>
  <circle cx="114" cy="70" r="5" fill="#e8a0a0" opacity="0.5"/>

  <!-- Hair bun top -->
  <circle cx="100" cy="47" r="8" fill="#3a2a1a"/>
  <circle cx="100" cy="47" r="3" fill="#f0d080"/>
</svg>
