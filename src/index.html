<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TauriTavern Console</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="logo">TauriTavern <span>Console</span></h1>
      <div class="header-actions">
        <button id="btn-create" class="btn btn-primary" title="Create Character Card">+ Create</button>
        <button id="btn-import" class="btn btn-primary">Import</button>
        <button id="btn-settings" class="btn btn-ghost" title="Settings">&#9881;</button>
      </div>
    </header>

    <main class="main">
      <div id="cartridge-grid" class="cartridge-grid">
        <div class="empty-state">
          <p>No cartridges installed.</p>
          <p class="sub">Click "Import Cartridge" to add a <code>.taurichar</code> file.</p>
        </div>
      </div>
    </main>

    <div id="settings-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Settings</h2>
          <button id="btn-close-settings" class="btn btn-ghost">&times;</button>
        </div>
        <div class="modal-body">
          <div class="provider-selector">
            <label>
              <span>Provider</span>
              <select id="provider-dropdown">
                <option value="">-- Select Provider --</option>
              </select>
            </label>
          </div>
          <div id="provider-config" class="provider-config hidden">
            <label>
              <span>API Key</span>
              <input type="password" id="api-key-input" placeholder="" />
            </label>
            <label id="provider-url-group">
              <span>API URL</span>
              <input type="text" id="provider-url-input" placeholder="https://api.example.com/v1/chat/completions" />
            </label>
            <button id="btn-fetch-models" class="btn btn-primary btn-sm">Fetch Models</button>
            <label id="model-select-group" class="hidden">
              <span>Model</span>
              <select id="model-dropdown">
                <option value="">-- Select Model --</option>
              </select>
            </label>
            <div id="connection-status" class="hidden"></div>
            <div id="profile-save-group" class="hidden">
              <label>
                <span>Profile Name</span>
                <input type="text" id="profile-name-input" placeholder="provider-model" />
              </label>
              <button id="btn-connect" class="btn btn-primary btn-sm">Connect</button>
            </div>
          </div>
          <div id="saved-profiles" class="saved-profiles">
            <h3>Saved Profiles</h3>
            <div id="profile-list"></div>
            <button id="btn-diagnose" class="btn btn-ghost btn-sm" style="margin-top:8px;">Diagnose</button>
            <button id="btn-check-keyring" class="btn btn-ghost btn-sm" style="margin-top:4px;">Check Keyring</button>
            <pre id="diagnose-output" class="hidden" style="margin-top:8px;font-size:0.7rem;color:var(--text-muted);white-space:pre-wrap;word-break:break-all;"></pre>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
